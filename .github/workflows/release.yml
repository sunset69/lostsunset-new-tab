name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 0.1.0），留空则读取 package.json'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: 构建打包并发布
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试
        run: npm test

      - name: 构建并打包
        run: npm run release

      - name: 读取版本号
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip=release/lostsunset-new-tab-v${VERSION}.zip" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: 校验产物
        run: |
          test -f "${{ steps.version.outputs.zip }}"
          echo "ZIP 存在：${{ steps.version.outputs.zip }}"

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: LostSunset 新标签页 ${{ steps.version.outputs.tag }}
          files: ${{ steps.version.outputs.zip }}
          generate_release_notes: true
          fail_on_unmatched_files: true
